[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracebridge-demo"
version = "0.1.0"
description = "Evidence-first API error triage demo for NVIDIA Agentic AI Hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nvidia-nat[langchain]==1.8.0",
  "openai==2.54.0",
  "python-dotenv==1.2.3",
  "streamlit==1.64.0",
  "reportlab==4.5.1",
  "httpx==0.28.1",
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
  "pydantic==2.13.5",
  "SQLAlchemy==2.1.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
service = ["fastapi==0.141.1", "uvicorn==0.54.0"]
postgres = ["psycopg[binary]==3.3.6", "pgvector==0.4.2", "alembic==1.20.0"]

[project.entry-points."nat.plugins"]
tracebridge = "tracebridge.nat_plugin"

[tool.setuptools.packages.find]
include = ["tracebridge*"]

[tool.setuptools.package-data]
"tracebridge.storage" = ["alembic/*.py", "alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["output", "tmp", ".venv", ".git"]
