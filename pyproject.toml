[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracebridge-demo"
version = "0.1.0"
description = "Evidence-first API error triage demo for NVIDIA Agentic AI Hackathon"
requires-python = ">=3.12"
dependencies = [
  "nvidia-nat[langchain]>=1.8,<1.9",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
]

[project.entry-points."nat.plugins"]
tracebridge = "tracebridge.nat_plugin"

[tool.setuptools.packages.find]
include = ["tracebridge*"]
