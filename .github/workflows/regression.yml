name: Regression

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: tracebridge
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracebridge -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
          --memory 1g --cpus 1
    env:
      TRACEBRIDGE_TEST_DATABASE_URL: postgresql://tracebridge:integration-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements-linux-py312.lock ".[test,service,postgres]"
          python -m pip check
          python -m pip freeze --exclude tracebridge-demo > requirements-resolved-linux.txt
      - name: Run regression with isolated databases and model doubles
        run: python -m pytest -q --junitxml output/regression.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-results
          path: |
            output/regression.xml
            requirements-resolved-linux.txt
          retention-days: 7
          if-no-files-found: warn
