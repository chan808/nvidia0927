name: Deployment image check (manual)
"on":
  workflow_dispatch:
    inputs:
      export_image:
        description: Export the checked image for manual transfer.
        type: boolean
        default: false
      deploy:
        description: Deploy to the dedicated TraceBridge AWS pilot after verification.
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  pilot:
    uses: ./.github/workflows/aws-pilot.yml
    with:
      deploy: ${{ inputs.deploy }}
      export_image: ${{ inputs.export_image }}
