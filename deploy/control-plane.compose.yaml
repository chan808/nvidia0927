# Combine with compose.yaml for a private owner pilot with paired PCs.
services:
  control:
    image: ${TRACEBRIDGE_IMAGE:-tracebridge:preview}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "scripts.serve_control", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    init: true
    env_file:
      - ${TRACEBRIDGE_APP_ENV_FILE:-./app.env}
    environment:
      TRACEBRIDGE_OPERATOR_TOKEN_FILE: /app/output/control-plane/operator-token
      TRACEBRIDGE_CONTROL_DB: /app/output/control-plane/state.sqlite3
    expose:
      - "8765"
    volumes:
      - type: bind
        source: ${TRACEBRIDGE_DATA_DIR:?Set an absolute server data directory}
        target: /app/output
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=134217728,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    environment:
      STREAMLIT_SERVER_BASE_URL_PATH: owner
      TRACEBRIDGE_CONTROL_URL: http://control:8765
      TRACEBRIDGE_OPERATOR_TOKEN_FILE: /app/output/control-plane/operator-token
  proxy:
    depends_on:
      control:
        condition: service_healthy
    volumes:
      - ./Caddyfile.control-plane:/etc/caddy/Caddyfile:ro
