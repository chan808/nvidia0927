worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    set_real_ip_from 172.28.70.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=clients:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 8080;
        client_max_body_size 300k;
        client_body_timeout 15s;
        location / {
            limit_req zone=api burst=30 nodelay;
            limit_conn clients 20;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_pass http://control:8765;
        }
    }
}
